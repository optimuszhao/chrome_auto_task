{% extends "base.html" %}
{% block title %}Mock 测试站点{% endblock %}
{% block content %}
<section class="page-head"><div><h1>Mock 测试站点</h1><p>用于验证登录、表单提交、截图和下载。</p></div></section>
<section class="panel mock">
  <div id="loginArea">
    <h2>登录</h2>
    <input id="username" placeholder="username">
    <input id="password" placeholder="password" type="password">
    <button id="loginBtn">登录</button>
  </div>
  <div id="dashboard" hidden>
    <h2>Dashboard</h2>
    <button id="openFormBtn">打开表单</button>
    <button id="exportBtn">导出报表</button>
    <p id="exportStatus"></p>
  </div>
  <div id="formArea" hidden>
    <h2>提交表单</h2>
    <input id="title" placeholder="标题">
    <select id="level"><option value="low">low</option><option value="middle">middle</option><option value="high">high</option></select>
    <textarea id="content" placeholder="内容"></textarea>
    <button id="submitBtn">提交</button>
    <p id="submitStatus"></p>
  </div>
  <h2>操作日志</h2>
  <ul id="mockLog"></ul>
</section>
<script>
const log = (text) => {
  const li = document.createElement('li');
  li.textContent = new Date().toLocaleTimeString() + ' ' + text;
  document.querySelector('#mockLog').appendChild(li);
};
document.querySelector('#loginBtn').addEventListener('click', () => {
  document.querySelector('#loginArea').hidden = true;
  document.querySelector('#dashboard').hidden = false;
  log('登录成功');
});
document.querySelector('#openFormBtn').addEventListener('click', () => {
  document.querySelector('#formArea').hidden = false;
  log('打开表单');
});
document.querySelector('#submitBtn').addEventListener('click', () => {
  document.querySelector('#submitStatus').textContent = '提交成功';
  log('提交成功');
});
document.querySelector('#exportBtn').addEventListener('click', () => {
  const blob = new Blob(['mock report\\ncreated at ' + new Date().toISOString()], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mock-report.txt';
  a.click();
  URL.revokeObjectURL(url);
  document.querySelector('#exportStatus').textContent = '导出成功';
  log('导出成功');
});
</script>
{% endblock %}
